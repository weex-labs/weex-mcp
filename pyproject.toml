[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weex-mcp"
dynamic = ["version"]
description = "Embeddable safety-first WEEX MCP tool library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "WEEX MCP" }]
dependencies = []
keywords = ["mcp", "model-context-protocol", "weex", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/weex-labs/weex-mcp"
Repository = "https://github.com/weex-labs/weex-mcp"
Issues = "https://github.com/weex-labs/weex-mcp/issues"
Documentation = "https://github.com/weex-labs/weex-mcp#readme"

[project.optional-dependencies]
server = [
    "uvicorn>=0.30,<1",
]
dev = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "jsonschema>=4.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "setuptools>=77",
    "twine>=5",
]

[project.scripts]
weex-mcp = "weex_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "weex_mcp.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/run_demo_full_smoke.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
packages = ["weex_mcp"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
